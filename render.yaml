services:
  - type: web
    name: agm-wealth
    runtime: node
    plan: starter
    region: singapore
    numInstances: 1
    maxShutdownDelaySeconds: 30
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/agm-wealth.sqlite
      - key: STORAGE_PATH
        value: /var/data
      - key: UPLOAD_TMP_PATH
        value: /tmp/agm-wealth-uploads
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        value: kamlesh@agmwealth.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: MAX_CAS_PAGES
        value: "500"
    disk:
      name: agm-wealth-data
      mountPath: /var/data
      sizeGB: 1
